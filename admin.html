<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị | Nhật ký Mùa Hè Xanh</title><link rel="stylesheet" href="/assets/css/styles.css"></head>
<body data-page="management"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">♥</span><span>Nhật ký áo xanh</span></a><nav><a href="/">Trang chủ</a><a href="/write.html">Trang viết công khai</a><button id="logout-button" class="nav-cta admin-logout" hidden>Đăng xuất</button></nav></header>
<main class="management-page paper-texture">
  <section id="login-panel" class="login-panel"><p class="eyebrow">Khu vực riêng</p><h1>Đăng nhập quản trị</h1><form id="login-form"><label>Mật khẩu quản trị<input name="password" type="password" required autocomplete="current-password" autofocus></label><button class="button primary" type="submit">Đăng nhập</button><p class="form-status" role="status"></p></form></section>
  <section id="dashboard" class="admin-dashboard" hidden>
    <div class="admin-heading"><div><p class="eyebrow">Bảng điều khiển</p><h1>Quản trị tạp chí</h1></div><a class="button ghost" href="/write.html" target="_blank">Mở trang viết công khai ↗</a></div>
    <section class="admin-panel"><h2>Link bản in điện tử</h2><form id="settings-form" class="inline-form"><input name="printEditionUrl" type="url" required placeholder="https://..."><button class="button primary" type="submit">Lưu link</button><p class="form-status"></p></form></section>
    <section class="admin-panel"><div class="panel-title"><h2>Trang nhật ký</h2><span id="journal-total"></span></div><div id="admin-journals" class="admin-list"></div></section>
    <section class="admin-panel"><div class="panel-title"><h2>Bình luận</h2><span id="comment-total"></span></div><div id="admin-comments" class="admin-list"></div></section>
    <section class="admin-panel"><div class="panel-title"><h2>Thư viện ảnh/video chung</h2><span id="media-total"></span></div><form id="admin-gallery-form" class="admin-gallery-form"><label class="upload-zone"><input id="admin-media-files" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" multiple><span>＋ Chọn ảnh/video</span><small id="admin-media-selection">Chưa chọn tệp · tối đa 20 mục mỗi lần</small></label><textarea id="admin-media-links" rows="3" placeholder="Link YouTube hoặc Google Drive, mỗi link một dòng"></textarea><div id="admin-media-preview" class="admin-upload-preview" aria-live="polite"></div><button class="button primary" type="submit">Thêm vào thư viện</button><p class="form-status" role="status"></p></form><div id="admin-media" class="admin-media-grid"></div></section>
  </section>
</main><script src="/assets/js/admin.js" defer></script></body></html>
